  continuousIntegration:
    slot_uri: codemeta:continuousIntegration
  developmentStatus:
    slot_uri: codemeta:developmentStatus
  embargoEndDate:
    slot_uri: codemeta:embargoEndDate
  hasSourceCode:
    slot_uri: codemeta:hasSourceCode
  isSourceCodeOf:
    slot_uri: codemeta:isSourceCodeOf
  issueTracker:
    slot_uri: codemeta:issueTracker
  readme:
    slot_uri: codemeta:readme
  referencePublication:
    slot_uri: codemeta:referencePublication
