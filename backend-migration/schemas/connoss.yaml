  relatedSoftware:
    slot_uri: sdo:relatedSoftware
  contactPoint:
    slot_uri: sdo:contactPoint
  creditText:
    slot_uri: sdo:creditText
  alternateName:
    slot_uri: sdo:alternateName
  # extension set
  intendedUse:
    slot_uri: sdo:intendedUse 
  applicationDomain:
    slot_uri: sdo:applicationDomain
  legalConsiderations:
    slot_uri: sdo:legalConsiderations
  ethicalSocialConsiderations:
    slot_uri: sdo:ethicalSocialConsiderations
  archivedAt :
    slot_uri: sdo:archivedAt 
  conditionsOfAccess:
    slot_uri: sdo:conditionsOfAccess
  documentation:
    slot_uri: sdo:documentation
  developerDocumentation :
    slot_uri: cm:developerDocumentation 
  userDocumentation:
    slot_uri: cm:userDocumentation
  softwareInterface:
    slot_uri: sdo:softwareInterface
  testedWith:
    slot_uri: sdo:testedWith
  implementsSpecification:
    slot_uri: sdo:implementsSpecification
