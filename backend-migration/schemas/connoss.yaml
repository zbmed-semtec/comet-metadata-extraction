id: https://connoss-project.github.io/
name: connoss
title: Connoss (LinkML)
description: >-
  ConnOSS schema LinkML version
version: 0.0.1

prefixes:
  linkml:    https://w3id.org/linkml/
  sdo:       https://schema.org/
  cm:        https://codemeta.github.io/terms/
  spdx:      https://spdx.org/licenses/
  xsd:       http://www.w3.org/2001/XMLSchema#

default_prefix: schema
default_range: string

classes:
  Software:
    description:
      The main class of the ConnOSS schema
    slots:
      - codeRepository
      - codeSampleType
      - programmingLanguage
      - runtimePlatform
      - targetProduct
      # Properties from Thing -> CreativeWork -> SoftwareApplication
      - applicationCategory
      - applicationSubCategory
      - applicationSuite
      - availableOnDevice
      - countriesNotSupported
      - countriesSupported
      - downloadUrl
      - featureList
      - fileSize
      - installUrl
      - memoryRequirements
      - operatingSystem
      - permissions
      - processorRequirements
      - releaseNotes
      - screenshot
      - softwareAddOn
      - softwareHelp
      - softwareRequirements
      - softwareVersion
      - storageRequirements
      - supportingData
      # Properties from Thing -> CreativeWork
      - author
      - citation
      - contributor
      - copyrightHolder
      - copyrightYear
      - dateCreated
      - dateModified
      - datePublished
      - encodingFormat
      - funder
      - hasPart
      - isAccessibleForFree
      - isPartOf
      - keywords
      - license
      - publisher
      - review
      - sponsor
      # Properties from Thing
      - description
      - identifier
      - name
      - sameAs
      - url
      # Properties outside the hierarchy from Thing -> CreativeWork -> WebPage
      - relatedLink
      # Additional properties from Codemeta Thing -> CreativeWork -> Codemeta:Software
      - buildInstructions
      - continuousIntegration
      - developmentStatus
      - embargoEndDate
      - hasSourceCode
      - isSourceCodeOf
      - issueTracker
      - readme
      - referencePublication
      # Added in V4
      - relatedSoftware
      - contactPoint
      - creditText
      - alternateName
      # extension set
      - intendedUse 
      - applicationDomain
      - legalConsiderations
      - ethicalSocialConsiderations
      - archivedAt 
      - conditionsOfAccess
      - documentation
      - developerDocumentation 
      - userDocumentation
      - softwareInterface
      - testedWith
      - implementsSpecification
      - softwareContainer
      - input 
      - output
      - partOfCommunity
      - latestRelease
      - latestReleaseVersion

