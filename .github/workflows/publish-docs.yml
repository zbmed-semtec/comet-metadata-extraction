name: Publish docs

on:
  push:
    branches:
      - main
      - feature/fix/llm_
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install "mkdocs>=1.6.0" "mkdocs-material>=9.5.0"

      - name: Build site
        working-directory: backend-migration
        run: mkdocs build --strict

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: backend-migration/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4